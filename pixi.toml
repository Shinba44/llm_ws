# パーソナルLLMエージェント自作プロジェクト
#
# 環境の使い分けは docs/01_SETUP.md §3 を参照。
#   pixi run -e gpu    ... GPU機。トラックB本番
#   pixi run -e laptop ... GPUなしのマシン
#
# 依存を追加する時は feature を必ず指定すること（docs/01_SETUP.md §5）。
# conda-forge と PyPI で同じ依存チェーンを混ぜないこと。torch 系はすべて --pypi。

[workspace]
name = "llm_ws"
description = "常駐・解析・能動通知を行うパーソナルLLMエージェントの自作プロジェクト"
version = "0.1.0"
channels = ["conda-forge"]
platforms = ["linux-64"]

[dependencies]
python = ">=3.11,<3.13"

# ─────────────────────────────────────────
# タスク
# ─────────────────────────────────────────

[tasks]
agent = { cmd = "python -m agent.cli", description = "エージェントCLIを起動する" }
demo = { cmd = "python -c \"import webbrowser,pathlib; webbrowser.open(pathlib.Path('docs/assets/field_demo.html').resolve().as_uri())\"", description = "解析フィールドのデモをブラウザで開く" }
lint = { cmd = "ruff check .", description = "静的解析" }
fmt = { cmd = "ruff format .", description = "整形" }
test = { cmd = "python -m pytest -q", description = "テスト" }
eval-prefix = { cmd = "python scripts/eval_prefix.py", description = "プレフィックス遵守率を計測する（A1）" }
eval-watch = { cmd = "python scripts/eval_watch.py", description = "eval-prefix の進捗をリアルタイム表示する" }

# 複数行のコマンドはインラインテーブルに書けないため、テーブル節で定義する
[tasks.machine-info]
description = "マシンプロファイル記入用の情報を出力する"
cmd = """
echo "CPU: $(LANG=C lscpu | grep 'Model name' | sed 's/.*: *//')" &&
echo "RAM: $(free -g | awk '/^Mem:/{print $2}') GB" &&
(nvidia-smi --query-gpu=name,memory.total --format=csv,noheader || echo "GPU: none")
"""

[tasks.gpu-check]
description = "PyTorchからGPUが見えるか確認する"
cmd = "python scripts/gpu_check.py"

# ─────────────────────────────────────────
# feature: トラックA（エージェント本体）
# ─────────────────────────────────────────

[feature.agent.dependencies]
ruff = "*"
pytest = "*"

# 商用APIは使わない方針（docs/00_PLAN.md §9）。
# openai パッケージは Ollama / llama.cpp server の OpenAI互換エンドポイントを
# 叩くためのクライアントとして使う。OpenAI社のサービスには接続しない。
[feature.agent.pypi-dependencies]
openai = "*"
httpx = "*"
python-dotenv = "*"
rich = "*"
prompt-toolkit = "*"

# ─────────────────────────────────────────
# feature: PyTorch（CPU / GPU で排他）
# ─────────────────────────────────────────

[feature.cpu.pypi-dependencies]
torch = { version = ">=2.5", index = "https://download.pytorch.org/whl/cpu" }

# cuda を宣言しないと仮想パッケージ __cuda が立たず、CPU版が選ばれる。消さないこと。
#
# pixi 0.72 はこの書き方に非推奨警告を出し、[workspace] の
# platforms = [{ platform = "linux-64", cuda = "12" }] を勧めてくる。
# ただしその記法は workspace 直下でしか使えず、feature 単位で指定できない。
# workspace 側に書くと GPU の無いマシンで laptop 環境を作る時に
# システム要件チェックで弾かれるため、ここでは feature 単位の旧記法を使う。
# feature 単位の新記法が入ったら移行する。
[feature.gpu.system-requirements]
cuda = "12"

# ★ cu126 と <2.8 の固定は GTX 1080 Ti（Pascal / sm_61）のため。緩めないこと。
#
#   PyTorch 2.8 以降、CUDA 12.8/12.9 ビルドから sm_60/sm_61 が削除された。
#     cu126 : 5.0 6.0 6.1 7.0 7.5 8.0 8.6 9.0  ← Pascal あり
#     cu128 : 7.5 8.0 8.6 9.0 10.0 12.0        ← Pascal なし
#   cu128 を指定するとインストールは通るが実行時にカーネル未対応で落ちる。
#
#   GPUを新しい世代（Ampere以降）に載せ替えたら、この制約を外して
#   index を cu128/cu130 に上げてよい。docs/01_SETUP.md §4.3 と §6.1 参照。
[feature.gpu.pypi-dependencies]
torch = { version = ">=2.6,<2.8", index = "https://download.pytorch.org/whl/cu126" }

# ─────────────────────────────────────────
# feature: トラックB（学習・ファインチューニング）
# B3以降で必要になったら pixi add --pypi --feature train <pkg>
# ─────────────────────────────────────────

[feature.train.pypi-dependencies]
numpy = "*"
tqdm = "*"
tensorboard = "*"

# ─────────────────────────────────────────
# feature: ネイティブビルド（B7 llama.cpp）
# ─────────────────────────────────────────

[feature.native.dependencies]
cmake = "*"
ninja = "*"
cxx-compiler = "*"

# ─────────────────────────────────────────
# feature: 常駐オーバーレイUI（A5 Electron）
# ─────────────────────────────────────────

[feature.ui.dependencies]
nodejs = "22.*"

# ─────────────────────────────────────────
# 環境
# ─────────────────────────────────────────

[environments]
default = ["agent", "cpu"]
laptop = ["agent", "cpu", "ui"]
gpu = ["agent", "gpu", "train", "native"]
